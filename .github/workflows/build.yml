name: Build
on: [push, pull_request, workflow_dispatch]

jobs:
  archlinux:
    name: Archlinux
    runs-on: ubuntu-latest
    container: archlinux
    steps:
      - uses: actions/checkout@v4

      - name: Download Dependencies
        run: |
          pacman --noconfirm --noprogressbar -Syyu
          pacman --noconfirm --noprogressbar -Sy \
            base-devel \
            cmake \
            ninja \
            pkgconf \
            qt6-base \
            qt6-declarative \
            qt6-svg \
            qt6-wayland \
            qt6-shadertools \
            wayland-protocols \
            wayland \
            libdrm \
            vulkan-headers \
            libxcb \
            libpipewire \
            cli11 \
            polkit \
            jemalloc \
            libunwind \
            git # for cpptrace clone

      - name: Build
        run: |
          cmake -GNinja -B build -DVENDOR_CPPTRACE=ON
          cmake --build build
